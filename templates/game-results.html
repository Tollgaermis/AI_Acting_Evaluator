<!DOCTYPE html>
<html lang="en">
{% extends "base.html" %}

{% block content %}
<section class="description-section">
    <header class="minimal-header">
        <h1>Game Results</h1>
    </header>

    <div class="result-card">
        <h2>Scores</h2>
        <p><strong>Emotion Game Score:</strong> {{ emotion_score }}</p>
        <p><strong>Emphasis Game Score:</strong> {{ emphasis_score }}</p>
        <p><strong>Sliding Scale Game Score:</strong> {{ sliding_game_score }}</p>
        <hr>
        <h2><strong>Final Score:</strong> {{ final_score }}</h2>
    </div>
</section>
{% endblock %}
